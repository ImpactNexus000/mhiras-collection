<svg viewBox="0 0 510 510" xmlns="http://www.w3.org/2000/svg" style="">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="30%" stop-color="#FFA500"/>
      <stop offset="60%" stop-color="#FF8C00"/>
      <stop offset="100%" stop-color="#B8620A"/>
    </linearGradient>
    <linearGradient id="goldGrad2" x1="0%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FFE44D"/>
      <stop offset="50%" stop-color="#FFA500"/>
      <stop offset="100%" stop-color="#8B4500"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background circle for favicon context -->
  <circle cx="250" cy="250" r="250" fill="url(#bg)" style="stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

  <!-- M shape - left leg -->
  <polygon points="80,380 80,145 155,145 155,220" fill="url(#goldGrad)" filter="url(#glow)" style="stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <!-- M shape - right leg -->
  <polygon points="420,380 420,145 345,145 345,220" fill="url(#goldGrad)" filter="url(#glow)" style="stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <!-- M shape - left inner diagonal -->
  <polygon points="155,145 250,240 200,285 80,145" fill="url(#goldGrad2)" filter="url(#glow)" style="stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <!-- M shape - right inner diagonal -->
  <polygon points="345,145 250,240 300,285 420,145" fill="url(#goldGrad2)" filter="url(#glow)" style="stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

  <!-- Inner square frame -->
  <rect x="190" y="175" width="120" height="120" rx="6" fill="none" stroke="url(#goldGrad)" stroke-width="14" filter="url(#glow)" style="fill:none;color:rgb(255, 255, 255);stroke-width:14px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

  <!-- Hexagon C shape inside -->
  <path d="M265,235 &#10;           L265,220 &#10;           Q265,208 253,205 &#10;           L250,204 &#10;           Q238,204 235,214 &#10;           L235,235 &#10;           L235,258 &#10;           Q235,270 247,273 &#10;           L250,274 &#10;           Q262,274 265,264 &#10;           L265,250" fill="none" stroke="#0a0a0a" stroke-width="22" stroke-linecap="round" style="fill:none;stroke:rgb(10, 10, 10);color:rgb(255, 255, 255);stroke-width:22px;stroke-linecap:round;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <path d="M265,235 &#10;           L265,220 &#10;           Q265,208 253,205 &#10;           L250,204 &#10;           Q238,204 235,214 &#10;           L235,235 &#10;           L235,258 &#10;           Q235,270 247,273 &#10;           L250,274 &#10;           Q262,274 265,264 &#10;           L265,250" fill="none" stroke="url(#goldGrad)" stroke-width="13" stroke-linecap="round" filter="url(#glow)" style="fill:none;color:rgb(255, 255, 255);stroke-width:13px;stroke-linecap:round;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
</svg>